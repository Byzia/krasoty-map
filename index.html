<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Красоты Планеты</title>
    
    <link rel="icon" href="data:,">

    <script src="https://cdn.jsdelivr.net/npm/@vkontakte/vk-bridge@2.8.2/dist/browser.min.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="tab-map" class="tab-content active">
        <div id="map"></div>
        <button id="geoBtn" class="geo-btn" onclick="locateUser()">
            <i class="fa-solid fa-location-crosshairs"></i>
        </button>
        <button id="surpriseBtn" class="surprise-btn" onclick="surpriseMe()">
            <i class="fa-solid fa-dice"></i> Удиви меня
        </button>
    </div>

    <div id="tab-feed" class="tab-content">
        <div class="feed-header">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" class="search-input" placeholder="Поиск мест..." oninput="filterFeed(this.value)">
            </div>
        </div>
        <div class="feed-container">
            <div id="feed-list" class="feed-list"></div>
        </div>
    </div>

    <div id="tab-profile" class="tab-content">
        <div class="profile-container" id="profile-container">
            </div>
    </div>

    <div class="tabbar">
        <button class="tab-btn active" onclick="switchTab('map', event)">
            <i class="fa-solid fa-map-location-dot"></i>
            <span>Карта</span>
        </button>
        <button class="tab-btn" onclick="switchTab('feed', event)">
            <i class="fa-solid fa-compass"></i>
            <span>Лента</span>
        </button>
        <button class="tab-btn" onclick="switchTab('profile', event)">
            <i class="fa-solid fa-user"></i>
            <span>Профиль</span>
        </button>
    </div>

    <div id="modal-overlay" class="modal-overlay" onclick="closeModal()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <button class="modal-close-btn" onclick="closeModal()">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div id="modal-content"></div>
        </div>
    </div>

    <script src="profile.js"></script>
    <script src="map.js"></script>
    <script src="feed.js"></script>

    <script>
        function enableMouseDragScroll(containerSelector) {
            document.addEventListener('mousedown', (e) => {
                const container = e.target.closest(containerSelector);
                if (!container) return;

                let isDown = true;
                let startX = e.pageX - container.offsetLeft;
                let scrollLeft = container.scrollLeft;

                const onMouseMove = (moveEvent) => {
                    if (!isDown) return;
                    moveEvent.preventDefault();
                    const x = moveEvent.pageX - container.offsetLeft;
                    const walk = (x - startX) * 1.5;
                    container.scrollLeft = scrollLeft - walk;
                };

                const onMouseUp = () => {
                    isDown = false;
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                };

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });
        }

        async function switchTab(tabName, evt) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            const targetTab = document.getElementById(`tab-${tabName}`);
            if (targetTab) targetTab.classList.add('active');

            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            if (evt && evt.currentTarget) {
                evt.currentTarget.classList.add('active');
            } else {
                const targetBtn = Array.from(document.querySelectorAll('.tab-btn')).find(b => {
                    const onclickAttr = b.getAttribute('onclick');
                    return onclickAttr && onclickAttr.includes(`'${tabName}'`);
                });
                if (targetBtn) targetBtn.classList.add('active');
            }

            if (tabName === 'map') {
                if (typeof initMap === 'function') initMap();
                setTimeout(() => { if (typeof map !== 'undefined' && map) map.invalidateSize(); }, 200);
            } else if (tabName === 'feed') {
                if (typeof loadFeedData === 'function') await loadFeedData();
            } else if (tabName === 'profile') {
                if (typeof allPlacesData !== 'undefined' && allPlacesData.length === 0 && typeof loadFeedData === 'function') {
                    await loadFeedData();
                }
                if (typeof renderProfileScreen === 'function') {
                    renderProfileScreen();
                }
            }
        }

        window.onload = async () => {
            if (window.vkBridge) {
                try {
                    await vkBridge.send('VKWebAppInit');
                } catch (e) {
                    console.warn('VK Bridge Init Warning:', e);
                }
            }

            enableMouseDragScroll('.chips-scroll-container');

            try {
                if (typeof loadVkUserData === 'function') await loadVkUserData();
                if (typeof loadFavoritesFromVK === 'function') await loadFavoritesFromVK();
                if (typeof loadFeedData === 'function') await loadFeedData();
            } catch (err) {
                console.error('Data Load Error:', err);
            }

            if (typeof initMap === 'function') initMap();
        };
    </script>
</body>
</html>
