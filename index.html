<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Красоты Планеты</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@vkontakte/vk-bridge@2.8.2/dist/browser.min.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div id="tab-map" class="tab-content active">
        <div id="map"></div>
        <div class="geo-btn" id="geoBtn">🎯</div>
    </div>

    <div id="tab-feed" class="tab-content">
        <div class="placeholder-screen">
            <i class="fa-solid fa-layer-group"></i>
            <h2>Лента мест</h2>
            <p>Здесь появится каталог всех локаций в виде списка.</p>
        </div>
    </div>

    <div id="tab-favorites" class="tab-content">
        <div class="placeholder-screen">
            <i class="fa-solid fa-heart"></i>
            <h2>Избранное</h2>
            <p>Здесь будут ваши сохраненные локации.</p>
        </div>
    </div>

    <nav class="tabbar">
        <button class="tab-btn active" onclick="switchTab('map')">
            <i class="fa-solid fa-map-location-dot"></i>
            <span>Карта</span>
        </button>
        <button class="tab-btn" onclick="switchTab('feed')">
            <i class="fa-solid fa-list"></i>
            <span>Места</span>
        </button>
        <button class="tab-btn" onclick="switchTab('favorites')">
            <i class="fa-solid fa-heart"></i>
            <span>Избранное</span>
        </button>
    </nav>

    <script src="map.js"></script>
    <script>
        // Инициализация VK
        if (window.vkBridge) {
            try { vkBridge.send('VKWebAppInit'); } catch(e) {}
        }

        // Логика переключения вкладок
        function switchTab(tabName) {
            // Переключаем активность экранов
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');

            // Переключаем кнопки в таббаре
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');

            // Если переключились на карту — инициализируем ее и пересчитываем размер
            if (tabName === 'map') {
                initMap();
                setTimeout(() => { if(map) map.invalidateSize(); }, 200);
            }
        }

        // Автостарт карты при открытии
        window.onload = () => {
            initMap();
        };
    </script>
</body>
</html>
