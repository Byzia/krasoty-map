<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Красоты Планеты</title>
    
    <!-- 1. VK Bridge -->
    <script src="https://cdn.jsdelivr.net/npm/@vkontakte/vk-bridge@2.8.2/dist/browser.min.js"></script>

    <!-- 2. Иконки FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- 3. Leaflet & MarkerCluster -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <!-- 4. Стили v=9 -->
    <link rel="stylesheet" href="style.css?v=10" />
</head>
<body>

    <!-- Вкладка 1: Карта -->
    <div id="tab-map" class="tab-content active">
        <div id="map"></div>
        <!-- Кнопка "Удиви меня" (Случайное место) -->
        <div class="dice-btn" id="diceBtn" onclick="surpriseMe()" title="Случайное место">🎲</div>
        <!-- Кнопка "Моё местоположение" -->
        <div class="geo-btn" id="geoBtn">🎯</div>
    </div>

    <!-- Вкладка 2: Лента мест -->
    <div id="tab-feed" class="tab-content">
        <div class="feed-header">
            <input type="text" class="search-input" placeholder="🔍 Поиск мест и регионов..." oninput="filterFeed(this.value)">
        </div>
        <div id="feed-list" class="feed-container">
            <div class="placeholder-screen">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <p>Загрузка мест...</p>
            </div>
        </div>
    </div>

    <!-- Вкладка 3: Профиль -->
    <div id="tab-profile" class="tab-content">
        <div id="profile-content" class="profile-container">
            <div class="placeholder-screen">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <p>Загрузка профиля...</p>
            </div>
        </div>
    </div>

    <!-- Модальное окно деталей -->
    <div id="modal-overlay" class="modal-overlay" onclick="closeModal()"></div>

    <!-- Нижняя навигация (Таббар) -->
    <nav class="tabbar">
        <button class="tab-btn active" onclick="switchTab('map', event)">
            <i class="fa-solid fa-map-location-dot"></i>
            <span>Карта</span>
        </button>
        <button class="tab-btn" onclick="switchTab('feed', event)">
            <i class="fa-solid fa-list"></i>
            <span>Места</span>
        </button>
        <button class="tab-btn" onclick="switchTab('profile', event)">
            <i class="fa-solid fa-user"></i>
            <span>Профиль</span>
        </button>
    </nav>

    <!-- Подключаем скрипты модулей -->
    <script src="feed.js"></script>
    <script src="profile.js"></script>
    <script src="map.js"></script>
    <script>
        if (window.vkBridge) {
            try { vkBridge.send('VKWebAppInit'); } catch(e) {}
        }

        function switchTab(tabName, event) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');

            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            if (event) {
                event.currentTarget.classList.add('active');
            } else {
                const targetBtn = Array.from(document.querySelectorAll('.tab-btn')).find(b => b.getAttribute('onclick').includes(`'${tabName}'`));
                if (targetBtn) targetBtn.classList.add('active');
            }

            if (tabName === 'map') {
                if (typeof initMap === 'function') initMap();
                setTimeout(() => { if(map) map.invalidateSize(); }, 200);
            } else if (tabName === 'feed') {
                if (typeof loadFeedData === 'function') loadFeedData();
            } else if (tabName === 'profile') {
                if (allPlacesData.length === 0 && typeof loadFeedData === 'function') {
                    loadFeedData().then(() => renderProfileScreen());
                } else {
                    renderProfileScreen();
                }
            }
        }

        window.onload = async () => {
            if (typeof loadVkUserData === 'function') await loadVkUserData();
            if (typeof loadFavoritesFromVK === 'function') await loadFavoritesFromVK();
            if (typeof loadFeedData === 'function') await loadFeedData();
            if (typeof initMap === 'function') initMap();
        };
    </script>
</body>
</html>
